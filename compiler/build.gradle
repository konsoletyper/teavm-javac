
plugins {
    id "java"
    alias libs.plugins.teavm
}

configurations {
    classlibInput {
        transitive = false
    }
    bootstrapCompiler {
        transitive = false
    }
    dist {
        transitive = false
    }
}

dependencies {
    implementation project(":javac")
    implementation project(":worker")
    compileOnly libs.teavm.core
    implementation libs.teavm.tooling
    implementation libs.teavm.bootstrap.compiler
    implementation libs.asm.core
    classlibInput libs.teavm.classlib
    classlibInput libs.teavm.jso
    classlibInput libs.teavm.jso.apis
    bootstrapCompiler libs.teavm.bootstrap.compiler

    testImplementation libs.teavm.browser.runner
    testImplementation libs.jackson.databind
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
}

sourceSets {
    classlibEmu {
    }
}

compileJava {
    options.compilerArgs.addAll("--limit-modules", "java.base")
}

teavm {
    all {
        mainClass = "org.teavm.javac.CompilerLib"
    }
    wasmGC {
        outOfProcess = true
        processMemory = 4096
        modularRuntime = true
    }
}

def classlibOutDir = project.layout.buildDirectory.dir("classlib")

tasks.register("generateClassLib", JavaExec) {
    def output = classlibOutDir.map { it.file("compile-classlib-teavm.bin") }
    dependsOn configurations.classlibInput
    dependsOn sourceSets.classlibEmu.output
    inputs.files configurations.classlibInput
    inputs.files {
        sourceSets.classlibEmu.output.classesDirs.collect { fileTree(it) }
    }
    outputs.file output
    args {
        [
            output.get().asFile.absolutePath,
            *configurations.classlibInput.files.collect { it.absolutePath },
            *sourceSets.classlibEmu.output.classesDirs.files.collect { it.absolutePath }
        ].iterator()
    }
    classpath sourceSets.main.output, sourceSets.main.runtimeClasspath
    mainClass = "org.teavm.javac.StdlibConverter"
}

def buildTeaVMClassLib = tasks.register("buildTeaVMClassLib") {
    def input = configurations.bootstrapCompiler
    def outputFile = project.layout.buildDirectory.file("classlib/runtime-classlib-teavm.bin")
    inputs.files input
    outputs.file outputFile
    doLast {
        def jar = input.singleFile
        def classlibEntry = "org/teavm/compiler/bootstrap/runtime-classlib-teavm.bin"
        def file = outputFile.get().asFile
        file.parentFile.mkdirs()
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            def entry = zip.getEntry(classlibEntry)
            if (entry == null) {
                throw new GradleException("$classlibEntry not found in $jar")
            }
            zip.getInputStream(entry).withCloseable { file.bytes = it.bytes }
        }
    }
}

build {
    dependsOn buildWasmGC, buildTeaVMClassLib, generateClassLib
}

def createDist = tasks.register("createDist", Zip) {
    group "build"
    dependsOn buildWasmGC
    from buildTeaVMClassLib
    from generateClassLib
    from layout.buildDirectory.dir("generated/teavm/wasm-gc")
    dependsOn ":worker:buildWasmGC"
    from(project(":worker").layout.buildDirectory.dir("generated/teavm/wasm-gc")) {
        include "worker-client.wasm*"
    }
    exclude "src/**"
    archiveBaseName = "dist"
}

artifacts.add("dist", createDist)

def testHarnessDir = project.layout.buildDirectory.dir("test-harness")

def prepareTestHarness = tasks.register("prepareTestHarness", Sync) {
    dependsOn buildWasmGC
    from("src/test/js")
    from(layout.buildDirectory.dir("generated/teavm/wasm-gc")) {
        include "compiler.wasm*"
        exclude "*.html"
        into "compiler"
    }
    dependsOn ":worker:buildWasmGC"
    from(project(":worker").layout.buildDirectory.dir("generated/teavm/wasm-gc")) {
        include "worker-client.wasm*"
        exclude "*.html"
        into "worker-client"
    }
    from(buildTeaVMClassLib) {
        into "classlib"
    }
    from(generateClassLib) {
        into "classlib"
    }
    into testHarnessDir
}

test {
    useJUnitPlatform()
    dependsOn prepareTestHarness
    inputs.dir testHarnessDir
    inputs.dir "src/test/cases"
    systemProperty "teavm.javac.test.harnessDir", testHarnessDir.get().asFile.absolutePath
    systemProperty "teavm.javac.test.casesDir", file("src/test/cases").absolutePath
    def browser = providers.gradleProperty("teavm.javac.test.browser")
    if (browser.isPresent()) {
        systemProperty "teavm.javac.test.browser", browser.get()
    }
}
